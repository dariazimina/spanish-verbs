<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Испанские глаголы A1–A2 — тренировка и словарь">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Spanish Verbs">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Spanish Verbs</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">Spanish Verbs</div>
      <div class="subtitle">A1–A2</div>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Настройки">⚙️</button>
  </header>

  <main>
    <nav class="tabs">
      <button class="tab active" data-screen="learn">Учить</button>
      <button class="tab" data-screen="review">Повторять</button>
      <button class="tab" data-screen="dictionary">Словарь</button>
    </nav>

    <section id="learn" class="screen active"></section>
    <section id="review" class="screen"></section>
    <section id="dictionary" class="screen"></section>
  </main>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Настройки</h2>
        <button id="closeSettings" class="icon-btn">✕</button>
      </div>
      <div id="settingsContent"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
